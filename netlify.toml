# Netlify: builds on every push. Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# under Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# One canonical address.
[[redirects]]
  from = "https://www.gighopper.de/*"
  to = "https://gighopper.de/:splat"
  status = 301
  force = true

# Client-side routes (/show/…, /statistik) are served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets, so it can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
